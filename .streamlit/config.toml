# Matches the Driveline palette in dashboard.py, so the page chrome and the plot
# read as one object. Change the hexes there and mirror them here.
[theme]
base = "dark"
primaryColor = "#e23c2f"
backgroundColor = "#0e0f12"
secondaryBackgroundColor = "#16181d"
textColor = "#eceef1"

# Outline every widget rather than leaning on background fills alone.
showWidgetBorder = true
showSidebarBorder = true
borderColor = "#23262e"
dataframeBorderColor = "#23262e"

[browser]
gatherUsageStats = false
